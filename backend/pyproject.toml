[project]
name = "fmcg-rfp-backend"
version = "1.0.0"
description = "Multi-agent LangGraph backend for FMCG RFP processing with human-in-the-loop review"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-groq>=0.2.0",
    "supabase>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pyjwt>=2.13.0",
    "langchain-community>=0.4.2",
    "tavily-python>=0.7.25",
    "bcrypt>=5.0.0",
    "langchain-google-genai>=4.2.4",
    "faiss-cpu>=1.14.2",
    "resend>=2.30.1",
    "apscheduler>=3.11.2",
    "langchain>=1.3.2",
    "langchain-text-splitters>=1.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[dependency-groups]
dev = []

