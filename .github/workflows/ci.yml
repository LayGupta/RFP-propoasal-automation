name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Formatting & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install app dependencies + test/formatting tools
          pip install . pytest>=8.0 httpx>=0.27 pytest-asyncio>=0.24 ruff black

      - name: Check formatting with Black
        run: black --check app tests

      - name: Lint with Ruff
        run: ruff check app tests

      - name: Run Pytest
        env:
          # Environment stubs for testing
          ENV: "testing"
          SUPABASE_URL: "https://stub.supabase.co"
          SUPABASE_KEY: "stub-key-for-testing"
          JWT_SECRET: "stub-secret-for-testing-12345"
          SMTP_HOST: "smtp.stub.com"
          SMTP_PORT: "587"
          SMTP_USER: "stub_user"
          SMTP_PASSWORD: "stub_password"
          ALERT_EMAIL: "alert@stub.com"
          GROQ_API_KEY: "stub_groq_key"
        run: pytest -v

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run
